Aquí tienes un ejemplo completo de archivo HTML que integra la estructura visual para el escáner y el código JavaScript corregido y optimizado para que lea de lejos sin errores:

```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner - Tecno Trébol</title>
    <!-- Importar la librería html5-qrcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .scanner-container {
            width: 90%;
            max-width: 400px;
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }
        .btn-close {
            margin-top: 15px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-close:hover {
            background-color: #ff3333;
        }
    </style>
</head>
<body>

    <div class="scanner-container">
        <h3>Escanear PUERTA</h3>
        <!-- Contenedor donde se renderiza la cámara -->
        <div id="reader"></div>
        <button class="btn-close" onclick="detenerEscaner()">Cerrar / Finalizar</button>
    </div>

    <script>
        let html5QrCode;

        function iniciarEscaner() {
            // 1. Restricciones para forzar la cámara trasera y buena resolución (facilita lectura a distancia)
            const constraints = {
                facingMode: "environment",
                width: { ideal: 1280 },
                height: { ideal: 720 }
            };

            // 2. Configuración del área de escaneo ampliada
            const config = {
                fps: 10,
                qrbox: { width: 300, height: 200 }
            };

            html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start(
                constraints, // Objeto de restricciones
                config,      // Objeto de configuración
                (decodedText, decodedResult) => {
                    // Éxito al escanear
                    alert(`¡Código detectado: ${decodedText}!`);
                    console.log("Resultado:", decodedResult);
                    
                    // Opcional: Detener automáticamente al escanear con éxito
                    detenerEscaner();
                },
                (errorMessage) => {
                    // Errores de frame (se ignoran porque ocurren constantemente mientras busca el código)
                }
            ).catch((err) => {
                console.error("Error al iniciar la cámara:", err);
                alert(`Error al iniciar cámara: ${err}`);
            });
        }

        function detenerEscaner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    console.log("Escáner detenido correctamente.");
                }).catch((err) => {
                    console.error("No se pudo detener el escáner", err);
                });
            }
        }

        // Iniciar el escáner al cargar la página
        window.onload = iniciarEscaner;
    </script>
</body>
</html>

```
