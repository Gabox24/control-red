<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Se inhabilita el zoom del usuario para fijar la interfaz -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Generador de Registro Múltiple OCR</title>
  <!-- CDN de Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    /* Deshabilitar selección de texto global y zoom táctil accidental */
    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    
    /* Permitir selección únicamente en inputs y vista previa */
    input, textarea, .preview {
      -webkit-user-select: text;
      user-select: text;
    }

    body { 
      background-color: #f0f2f5; 
      padding: 10px; 
      margin: 0; 
      display: flex; 
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Tarjeta con ancho fijo máximo y responsive sin desbordamiento */
    .card { 
      background: white; 
      padding: 18px; 
      border-radius: 14px; 
      width: 100%; 
      max-width: 440px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
    }

    h2, h3 { color: #075e54; margin-top: 0; text-align: center; font-size: 20px; }
    label { font-weight: 600; font-size: 13px; margin-top: 10px; display: block; color: #444; }
    
    input, textarea { 
      width: 100%; 
      padding: 9px 12px; 
      margin-top: 4px; 
      border: 1px solid #ccc; 
      border-radius: 8px; 
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #075e54;
    }
    
    /* Zona de carga de imágenes compacta */
    .ocr-box { 
      background: #eef5f3; 
      border: 2px dashed #075e54; 
      padding: 12px; 
      border-radius: 10px; 
      text-align: center; 
      margin-bottom: 12px; 
    }
    .ocr-box input[type="file"] { display: none; }
    .btn-file { 
      background: #075e54; 
      color: white; 
      padding: 9px 16px; 
      border-radius: 8px; 
      cursor: pointer; 
      display: inline-block; 
      font-weight: bold; 
      font-size: 14px;
      margin-top: 4px; 
    }
    #status { font-size: 12px; color: #555; margin-top: 6px; font-style: italic; }

    .btn-group { display: flex; gap: 8px; margin-top: 12px; }
    button { 
      width: 100%; 
      color: white; 
      border: none; 
      padding: 11px; 
      border-radius: 8px; 
      font-size: 14px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    .btn-copy { background-color: #075e54; }
    .btn-wa { background-color: #25d366; }
    .btn-clear { background-color: #d9534f; margin-top: 8px; }
    
    .preview { 
      background: #e5ddd5; 
      padding: 10px; 
      border-radius: 8px; 
      font-family: monospace; 
      font-size: 12px; 
      white-space: pre-wrap; 
      margin-top: 12px; 
      min-height: 100px; 
      color: #111; 
      word-break: break-all;
    }
    
    .thumb-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; justify-content: center; }
    .thumb-container img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid #ccc; }
  </style>
</head>
<body>

<div class="card">
  <h2>📋 Registro de Entrega</h2>

  <!-- Escáner OCR Optimizado -->
  <div class="ocr-box">
    <p style="font-size: 13px; font-weight: bold; margin: 0 0 4px 0; color: #075e54;">📸 Escanear Múltiples Fotos</p>
    <label for="imageInput" class="btn-file">📷 Tomar / Seleccionar Fotos</label>
    <input type="file" id="imageInput" accept="image/*" multiple onchange="escaneoOCRMultiple(event)">
    <div id="status">Esperando imágenes...</div>
    <div class="thumb-container" id="thumbs"></div>
  </div>

  <!-- Formulario -->
  <label for="destino">Destino:</label>
  <input type="text" id="destino" placeholder="Ej: Maracay Centro (Puerta 3)">

  <label for="mb">Código(s) MB:</label>
  <input type="text" id="mb" placeholder="Ej: MB00073897 / MB00081234">

  <label for="pedido">Número(s) de Pedido:</label>
  <input type="text" id="pedido" placeholder="Ej: 90004421 / 90005532">

  <label for="cajas">Caja (Descripción):</label>
  <input type="text" id="cajas" placeholder="Ej: 3 Caja azul">

  <label for="nota">Número(s) de Nota de Entrega:</label>
  <input type="text" id="nota" placeholder="Ej: 223699 / 224154">

  <label for="dr">DR(s):</label>
  <input type="text" id="dr" placeholder="Ej: 19321 / 19774">

  <label for="entrega">Inspector que entrega:</label>
  <input type="text" id="entrega" value="Gabriel López">

  <label for="recibe">Inspector que recibe:</label>
  <input type="text" id="recibe" placeholder="Ej: Aldo Rumbo">

  <div class="btn-group">
    <button class="btn-copy" onclick="copiarReporte()">📋 Copiar</button>
    <button class="btn-wa" onclick="abrirWhatsApp()">💬 WhatsApp</button>
  </div>
  <button class="btn-clear" onclick="limpiarFormulario()">🗑️ Limpiar Formulario</button>

  <label style="margin-top: 15px;">Vista previa:</label>
  <div class="preview" id="preview"></div>
</div>

<!-- Canvas oculto para compresión ultra-rápida -->
<canvas id="compressCanvas" style="display:none;"></canvas>

<script>
  let mbsSet = new Set();
  let pedidosSet = new Set();
  let notasSet = new Set();
  let drsSet = new Set();
  let worker = null;

  // Reutilizar el mismo Tesseract Worker para procesamiento ultrarrápido
  async function obtenerWorker() {
    if (!worker) {
      worker = await Tesseract.createWorker('spa');
      // Modo de segmentación rápido (PSM 6: Bloque único de texto)
      await worker.setParameters({
        tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK
      });
    }
    return worker;
  }

  // Redimensionar e incrementar contraste antes del OCR para ganar velocidad
  function reescalarImagen(file, maxDimension = 1000) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxDimension) {
            height = Math.round((height * maxDimension) / width);
            width = maxDimension;
          }
        } else {
          if (height > maxDimension) {
            width = Math.round((width * maxDimension) / height);
            height = maxDimension;
          }
        }

        const canvas = document.getElementById('compressCanvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = URL.createObjectURL(file);
    });
  }

  async function escaneoOCRMultiple(event) {
    const files = Array.from(event.target.files);
    if (!files.length) return;

    const statusDiv = document.getElementById('status');
    const thumbsDiv = document.getElementById('thumbs');
    thumbsDiv.innerHTML = '';

    files.forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      thumbsDiv.appendChild(img);
    });

    statusDiv.innerText = "⚡ Inicializando motor ultrarrápido...";
    const ocrWorker = await obtenerWorker();

    for (let i = 0; i < files.length; i++) {
      statusDiv.innerText = `⚡ Optimizando foto ${i + 1} de ${files.length}...`;
      const base64Optimizado = await reescalarImagen(files[i]);

      statusDiv.innerText = `⚡ Escaneando foto ${i + 1} de ${files.length}...`;
      const result = await ocrWorker.recognize(base64Optimizado);
      const text = result.data.text;

      // Extracción rápida mediante Regex
      const mbMatches = text.match(/MB\d{6,10}/gi);
      if (mbMatches) mbMatches.forEach(m => mbsSet.add(m.toUpperCase()));

      const pedidoMatches = text.match(/\b\d{7,10}\b/g);
      if (pedidoMatches) pedidoMatches.forEach(p => pedidosSet.add(p));

      const notaMatches = [...text.matchAll(/NOTA\s*(?:DE\s*ENTREGA)?\s*(?:N[°ºo]?)?\s*[:\.]?\s*(\d{5,8})/gi)];
      notaMatches.forEach(m => { if (m[1]) notasSet.add(m[1]); });

      const drMatches = [...text.matchAll(/DR\s*[:\.]?\s*(\d{4,8})/gi)];
      drMatches.forEach(m => { if (m[1]) drsSet.add(m[1]); });

      if (!document.getElementById('destino').value) {
        const destinoMatch = text.match(/Destino\s*[:\.]?\s*([^\n\r]+)/i);
        if (destinoMatch && destinoMatch[1]) {
          document.getElementById('destino').value = destinoMatch[1].trim();
        }
      }
    }

    statusDiv.innerText = `✅ ¡Escaneo completado en tiempo récord!`;

    if (mbsSet.size > 0) document.getElementById('mb').value = Array.from(mbsSet).join(' / ');
    if (pedidosSet.size > 0) document.getElementById('pedido').value = Array.from(pedidosSet).join(' / ');
    if (notasSet.size > 0) document.getElementById('nota').value = Array.from(notasSet).join(' / ');
    if (drsSet.size > 0) document.getElementById('dr').value = Array.from(drsSet).join(' / ');

    actualizarPreview();
  }

  function obtenerTexto() {
    const destino = document.getElementById('destino').value || '[DESTINO]';
    const mb = document.getElementById('mb').value || '[MB]';
    const pedido = document.getElementById('pedido').value || '[PEDIDO]';
    const cajas = document.getElementById('cajas').value || '[CAJAS]';
    const nota = document.getElementById('nota').value || '[NOTA]';
    const dr = document.getElementById('dr').value || '[DR]';
    const entrega = document.getElementById('entrega').value || '[ENTREGA]';
    const recibe = document.getElementById('recibe').value || '[RECIBE]';

    return `📦 REGISTRO DE ENTREGA DIGITAL
Destino: ${destino}

🔖 DATOS DEL PRODUCTO
MB: ${mb}
Pedido: ${pedido}

📋 DETALLES DEL ENVÍO

📌 NOTA
${cajas} (Nota de entrega): ${nota}
DR:${dr}

👤 INSPECTORES

Inspector que entrega: ${entrega}
Inspector que recibe: ${recibe}`;
  }

  function actualizarPreview() {
    document.getElementById('preview').innerText = obtenerTexto();
  }

  function copiarReporte() {
    const texto = obtenerTexto();
    navigator.clipboard.writeText(texto).then(() => {
      alert('¡Reporte copiado al portapapeles!');
    });
  }

  function abrirWhatsApp() {
    const texto = encodeURIComponent(obtenerTexto());
    window.open(`https://wa.me/?text=${texto}`, '_blank');
  }

  function limpiarFormulario() {
    mbsSet.clear();
    pedidosSet.clear();
    notasSet.clear();
    drsSet.clear();

    document.getElementById('destino').value = '';
    document.getElementById('mb').value = '';
    document.getElementById('pedido').value = '';
    document.getElementById('cajas').value = '';
    document.getElementById('nota').value = '';
    document.getElementById('dr').value = '';
    document.getElementById('recibe').value = '';
    document.getElementById('imageInput').value = '';
    document.getElementById('status').innerText = 'Esperando imágenes...';
    document.getElementById('thumbs').innerHTML = '';

    actualizarPreview();
  }

  document.querySelectorAll('input').forEach(input => {
    input.addEventListener('input', actualizarPreview);
  });

  actualizarPreview();
</script>

</body>
</html>
