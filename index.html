<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registro de Entrega DAKA</title>
  <style>
    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
    
    input, textarea, .preview {
      -webkit-user-select: text;
      user-select: text;
    }

    body { 
      background-color: #f0f2f5; 
      padding: 10px; 
      margin: 0; 
      display: flex; 
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .card { 
      background: white; 
      padding: 18px; 
      border-radius: 14px; 
      width: 100%; 
      max-width: 440px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
    }

    h2 { color: #075e54; margin-top: 0; text-align: center; font-size: 20px; }
    label { font-weight: 600; font-size: 13px; margin-top: 10px; display: block; color: #444; }
    
    input, textarea { 
      width: 100%; 
      padding: 9px 12px; 
      margin-top: 4px; 
      border: 1px solid #ccc; 
      border-radius: 8px; 
      font-size: 14px;
      outline: none;
    }

    input:focus { border-color: #075e54; }
    
    .ocr-box { 
      background: #eef5f3; 
      border: 2px dashed #075e54; 
      padding: 12px; 
      border-radius: 10px; 
      text-align: center; 
      margin-bottom: 12px; 
    }
    .ocr-box input[type="file"] { display: none; }
    .btn-file { 
      background: #075e54; 
      color: white; 
      padding: 9px 16px; 
      border-radius: 8px; 
      cursor: pointer; 
      display: inline-block; 
      font-weight: bold; 
      font-size: 14px;
      margin-top: 4px; 
    }
    #status { font-size: 12px; color: #075e54; margin-top: 6px; font-weight: 600; word-break: break-word; }

    .btn-group { display: flex; gap: 8px; margin-top: 12px; }
    button { 
      width: 100%; 
      color: white; 
      border: none; 
      padding: 11px; 
      border-radius: 8px; 
      font-size: 14px; 
      font-weight: bold; 
      cursor: pointer; 
    }
    .btn-copy { background-color: #075e54; }
    .btn-wa { background-color: #25d366; }
    .btn-clear { background-color: #d9534f; margin-top: 8px; }
    
    .preview { 
      background: #e5ddd5; 
      padding: 10px; 
      border-radius: 8px; 
      font-family: monospace; 
      font-size: 12px; 
      white-space: pre-wrap; 
      margin-top: 12px; 
      min-height: 100px; 
      color: #111; 
      word-break: break-all;
    }
    
    .thumb-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; justify-content: center; }
    .thumb-container img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid #ccc; }
  </style>
</head>
<body>

<div class="card">
  <h2>📋 Registro de Entrega DAKA</h2>

  <!-- Escáner por IA -->
  <div class="ocr-box">
    <p style="font-size: 13px; font-weight: bold; margin: 0 0 4px 0; color: #075e54;">🤖 Escanear Etiqueta / Documento DAKA</p>
    <label for="imageInput" class="btn-file">📷 Tomar / Seleccionar Fotos</label>
    <input type="file" id="imageInput" accept="image/*" multiple onchange="escaneoConIA(event)">
    <div id="status">Esperando fotos para analizar...</div>
    <div class="thumb-container" id="thumbs"></div>
  </div>

  <!-- Formulario -->
  <label for="destino">Destino:</label>
  <input type="text" id="destino" placeholder="Ej: Charallave">

  <label for="puerta">Número de Puerta:</label>
  <input type="text" id="puerta" placeholder="Ej: 3">

  <label for="mb">Código(s) MB:</label>
  <input type="text" id="mb" placeholder="Ej: MB00073925 / MB00081234">

  <label for="pedido">Número(s) de Pedido:</label>
  <input type="text" id="pedido" placeholder="Ej: 90004144 / 90005532">

  <label for="r">R:</label>
  <input type="text" id="r" placeholder="Ej: R00123 / R00124">

  <label for="cajas">Cantidad de Cajas Azules:</label>
  <input type="text" id="cajas" placeholder="Ej: 3">

  <label for="nota">Número(s) de Nota de Entrega:</label>
  <input type="text" id="nota" placeholder="Ej: 223699 / 224154">

  <label for="dr">DR(s):</label>
  <input type="text" id="dr" placeholder="Ej: 19321 / 19774">

  <label for="entrega">Inspector que entrega:</label>
  <input type="text" id="entrega" value="Gabriel López">

  <label for="recibe">Inspector que recibe:</label>
  <input type="text" id="recibe" placeholder="Ej: Aldo Rumbo">

  <div class="btn-group">
    <button class="btn-copy" onclick="copiarReporte()">📋 Copiar</button>
    <button class="btn-wa" onclick="abrirWhatsApp()">💬 WhatsApp</button>
  </div>
  <button class="btn-clear" onclick="limpiarFormulario()">🗑️ Limpiar Formulario</button>

  <label style="margin-top: 15px;">Vista previa:</label>
  <div class="preview" id="preview"></div>
</div>

<script>
  // PEGA AQUÍ TU API KEY QUE EMPIEZA POR AIzaSy...
  const API_KEY = "AIzaSyD8I-iHwg-WARJ6wAnIe1QDTTE1Apr3H_s"; 

  let mbsSet = new Set();
  let pedidosSet = new Set();
  let rSet = new Set();
  let notasSet = new Set();
  let drsSet = new Set();

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
      reader.readAsDataURL(file);
    });
  }

  async function escaneoConIA(event) {
    if (!API_KEY || !API_KEY.startsWith("AIzaSy")) {
      alert("Error: Por favor reemplaza la variable API_KEY con tu clave válida de Google AI Studio (que empieza por AIzaSy...).");
      return;
    }

    const files = Array.from(event.target.files);
    if (!files.length) return;

    const statusDiv = document.getElementById('status');
    const thumbsDiv = document.getElementById('thumbs');
    thumbsDiv.innerHTML = '';

    files.forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      thumbsDiv.appendChild(img);
    });

    for (let i = 0; i < files.length; i++) {
      statusDiv.style.color = "#075e54";
      statusDiv.innerText = `⚡ Analizando foto ${i + 1} de ${files.length}...`;
      
      try {
        const base64Data = await fileToBase64(files[i]);
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;

        // Prompt mejorado para capturar tanto Etiquetas MB como Notas de Entrega hoja carta
        const promptText = `Analiza este documento o etiqueta de envío. Extrae solo los siguientes datos:
        
        1. "nota": Número de la NOTA DE ENTREGA (ejemplo: si dice "NOTA DE ENTREGA N° 224154", extrae "224154").
        2. "dr": El código DR (ejemplo: si en la sección de comentarios o texto dice "DR:19774" o "DR 19774", extrae "19774").
        3. "mb": Código que empieza por MB si existe (ej: MB00073925).
        4. "pedido": Número de pedido si existe.
        5. "destino": Nombre de la Sucursal o Destino (ej: "Maracay Centro", "Charallave", etc.). Extrae solo el nombre de la ciudad/sucursal sin prefijos innecesarios.
        6. "r": Código R si existe.

        Responde SOLAMENTE en formato JSON estricto con las claves: "mb", "pedido", "destino", "r", "nota", "dr". Si no encuentras alguna clave pon null.`;

        const body = {
          contents: [{
            parts: [
              { text: promptText },
              { inline_data: { mime_type: files[i].type || "image/jpeg", data: base64Data } }
            ]
          }],
          generationConfig: {
            response_mime_type: "application/json"
          }
        };

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message || "Error al procesar la API");
        }

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const resultado = JSON.parse(data.candidates[0].content.parts[0].text);

          if (resultado.mb && resultado.mb !== "null") mbsSet.add(resultado.mb.toString().trim());
          if (resultado.pedido && resultado.pedido !== "null") pedidosSet.add(resultado.pedido.toString().trim());
          if (resultado.r && resultado.r !== "null") rSet.add(resultado.r.toString().trim());
          if (resultado.nota && resultado.nota !== "null") notasSet.add(resultado.nota.toString().trim());
          if (resultado.dr && resultado.dr !== "null") drsSet.add(resultado.dr.toString().trim());

          if (resultado.destino && resultado.destino !== "null" && !document.getElementById('destino').value) {
            document.getElementById('destino').value = resultado.destino.toString().trim();
          }
        }
      } catch (e) {
        console.error("Error al procesar con IA:", e);
        statusDiv.style.color = "red";
        statusDiv.innerText = `❌ Error: ${e.message}`;
        return;
      }
    }

    statusDiv.style.color = "green";
    statusDiv.innerText = `✅ ¡Lectura completada!`;

    // Llenar campos acumulados si seleccionas varias fotos a la vez
    if (mbsSet.size > 0) document.getElementById('mb').value = Array.from(mbsSet).join(' / ');
    if (pedidosSet.size > 0) document.getElementById('pedido').value = Array.from(pedidosSet).join(' / ');
    if (rSet.size > 0) document.getElementById('r').value = Array.from(rSet).join(' / ');
    if (notasSet.size > 0) document.getElementById('nota').value = Array.from(notasSet).join(' / ');
    if (drsSet.size > 0) document.getElementById('dr').value = Array.from(drsSet).join(' / ');

    actualizarPreview();
  }

  function obtenerTexto() {
    const destino = document.getElementById('destino').value || '[DESTINO]';
    const puertaVal = document.getElementById('puerta').value.trim() || '[PUERTA]';
    const mb = document.getElementById('mb').value || '[MB]';
    const pedido = document.getElementById('pedido').value || '[PEDIDO]';
    const r = document.getElementById('r').value || '[R]';
    const cajas = document.getElementById('cajas').value.trim() || '[CANTIDAD]';
    const nota = document.getElementById('nota').value || '[NOTA]';
    const dr = document.getElementById('dr').value || '[DR]';
    const entrega = document.getElementById('entrega').value || '[ENTREGA]';
    const recibe = document.getElementById('recibe').value || '[RECIBE]';

    return `📦 REGISTRO DE ENTREGA DIGITAL
📍Destino: ${destino}
🚪Puerta: ${puertaVal}

🔖 DATOS DEL PRODUCTO
MB: ${mb}

📋 DETALLES DEL ENVÍO
Pedido: ${pedido}
R: ${r}

🟦 CAJAS AZULES: ${cajas}
📌 NOTA DE ENTREGA
N°: ${nota}
DR: ${dr}

👤 INSPECTORES

Inspector que entrega: ${entrega}
Inspector que recibe: ${recibe}`;
  }

  function actualizarPreview() {
    document.getElementById('preview').innerText = obtenerTexto();
  }

  function copiarReporte() {
    const texto = obtenerTexto();
    navigator.clipboard.writeText(texto).then(() => {
      alert('¡Reporte copiado al portapapeles!');
    });
  }

  function abrirWhatsApp() {
    const texto = encodeURIComponent(obtenerTexto());
    window.open(`https://wa.me/?text=${texto}`, '_blank');
  }

  function limpiarFormulario() {
    mbsSet.clear();
    pedidosSet.clear();
    rSet.clear();
    notasSet.clear();
    drsSet.clear();

    document.getElementById('destino').value = '';
    document.getElementById('puerta').value = '';
    document.getElementById('mb').value = '';
    document.getElementById('pedido').value = '';
    document.getElementById('r').value = '';
    document.getElementById('cajas').value = '';
    document.getElementById('nota').value = '';
    document.getElementById('dr').value = '';
    document.getElementById('recibe').value = '';
    document.getElementById('imageInput').value = '';
    document.getElementById('status').style.color = '#075e54';
    document.getElementById('status').innerText = 'Esperando fotos para analizar...';
    document.getElementById('thumbs').innerHTML = '';

    actualizarPreview();
  }

  document.querySelectorAll('input').forEach(input => {
    input.addEventListener('input', actualizarPreview);
  });

  actualizarPreview();
</script>

</body>
</html>
